    <style>
        html, body {
            margin: 0;
            background: #0f0e0d;
        }

        /* The SpinDex mark, its platter turning, until React takes over.
           Fixed, not margin-centred: a margin collapsing through #app was
           the page's only layout shift (CLS 0.12) once React replaced it. */
        .spinner {
            position: fixed;
            top: calc(50% - 32px);
            left: calc(50% - 32px);
            width: 64px;
            height: 64px;
            color: #e8e4de;
        }

        .spinner .platter {
            transform-origin: 16px 16px;
            animation: spinner-turn 1.8s linear infinite;
        }

        @keyframes spinner-turn {
            to { transform: rotate(360deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .spinner .platter { animation: none; }
        }
    </style>
