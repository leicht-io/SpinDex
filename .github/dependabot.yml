# Weekly dependency updates. chore(deps) commits don't release by themselves
# (see the Release workflow); they go out with the next feat or fix.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web-app
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
