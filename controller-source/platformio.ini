[env:m5stack-stamps3]
; Pinned: unversioned `espressif32` resolves to a fork (pioarduino) whose
; latest release bundles Arduino-ESP32 core 3.x / ESP-IDF 5.x, which breaks
; both ESP32TimerInterrupt (legacy driver/timer.h API removed) and the BLE
; library's Characteristic::getValue() return type (String, not std::string).
platform = espressif32@6.5.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
lib_deps =
	khoih-prog/ESP32TimerInterrupt@^2.3.0