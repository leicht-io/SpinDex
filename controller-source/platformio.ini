; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Without this, a bare `pio run`/`pio test` (no -e flag) builds every env
; below, including `native` -- which has no setup()/loop() (build_src_filter
; excludes arduino_target.ino) and fails to link. `native` still runs fine
; explicitly via `pio test -e native`.
default_envs = m5stack-stamps3

[env:m5stack-stamps3]
; Pinned: unversioned `espressif32` resolves to a fork (pioarduino) whose
; latest release bundles Arduino-ESP32 core 3.x / ESP-IDF 5.x, which breaks
; both ESP32TimerInterrupt (legacy driver/timer.h API removed) and the BLE
; library's Characteristic::getValue() return type (String, not std::string).
platform = espressif32@6.5.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
lib_deps =
	khoih-prog/ESP32TimerInterrupt@^2.3.0
; This env has no Unity-runnable tests of its own (test_rpm_counter's
; main() collides with Arduino's expected setup()/loop()) -- without this,
; `pio test` with no -e flag resolves to default_envs above and tries (and
; fails) to build/upload the test here instead of skipping to `native`.
test_ignore = *

; Runs on the host (no board/hardware needed) against the hardware-free
; logic in src/logic -- see test/test_rpm_counter. arduino_target.ino and
; src/data/* depend on Arduino.h/BLE and don't compile here, so this env is
; scoped to just the logic sources plus the test files themselves.
[env:native]
platform = native
test_build_src = true
build_src_filter = +<logic/>